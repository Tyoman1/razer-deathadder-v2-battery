name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 6.8.3
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --outputdir "$env:RUNNER_TEMP\Qt"
          "Qt6_DIR=$env:RUNNER_TEMP\Qt\6.8.3\msvc2022_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii

      - name: Configure
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $cmake = "$vsPath\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          & $cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:Qt6_DIR"

      - name: Build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $cmake = "$vsPath\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe"
          & $cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Verify plugin DLL
        shell: pwsh
        run: |
          if (-not (Test-Path build/Release/OpenRGBBatteryPlugin.dll)) {
            Write-Host "::error::Plugin DLL not found"
            exit 1
          }
          $size = (Get-Item build/Release/OpenRGBBatteryPlugin.dll).Length
          Write-Host "✅ OpenRGBBatteryPlugin.dll: $size bytes"

      - name: Verify BatteryProbe
        shell: pwsh
        run: |
          if (-not (Test-Path build/Release/BatteryProbe.exe)) {
            Write-Host "::error::BatteryProbe.exe not found"
            exit 1
          }
          $size = (Get-Item build/Release/BatteryProbe.exe).Length
          Write-Host "✅ BatteryProbe.exe: $size bytes"

      - name: SHA-256
        shell: pwsh
        run: |
          $hash = Get-FileHash build/Release/OpenRGBBatteryPlugin.dll -Algorithm SHA256
          "$($hash.Hash)  OpenRGBBatteryPlugin.dll" | Out-File build/Release/OpenRGBBatteryPlugin.sha256.txt -Encoding ascii

      - name: PE security analysis
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("build/Release/OpenRGBBatteryPlugin.dll")
          $peOffset = [System.BitConverter]::ToUInt32($bytes, 0x3C)
          $oh = $peOffset + 4 + 20
          $fh = $peOffset + 4
          $numSec = [System.BitConverter]::ToUInt16($bytes, $fh + 2)
          $optHdrSz = [System.BitConverter]::ToUInt16($bytes, $fh + 16)
          $secOff = $fh + 20 + $optHdrSz

          function RvaToRaw($rva) {
            for ($i = 0; $i -lt $numSec; $i++) {
              $so = $secOff + $i * 40
              $secVA  = [System.BitConverter]::ToUInt32($bytes, $so + 12)
              $secRaw = [System.BitConverter]::ToUInt32($bytes, $so + 20)
              $secSz  = [System.BitConverter]::ToUInt32($bytes, $so + 16)
              if ($rva -ge $secVA -and $rva -lt ($secVA + $secSz)) { return $rva - $secVA + $secRaw }
            }
            return 0
          }

          # Standard DLL characteristics
          $dllChars = [System.BitConverter]::ToUInt16($bytes, $oh + 70)
          $aslr = ($dllChars -band 0x0040) -ne 0
          $dep  = ($dllChars -band 0x0100) -ne 0
          $cfg  = ($dllChars -band 0x4000) -ne 0
          $heva = ($dllChars -band 0x0020) -ne 0

          # CET: IMAGE_DEBUG_TYPE_EX_DLLCHARACTERISTICS (type=20)
          $dataDirOfs = $oh + 112
          $debugRVA  = [System.BitConverter]::ToUInt32($bytes, $dataDirOfs + 6 * 8)
          $debugSize = [System.BitConverter]::ToUInt32($bytes, $dataDirOfs + 6 * 8 + 4)
          $debugOff = RvaToRaw $debugRVA
          $cet = $false
          if ($debugOff -gt 0 -and $debugSize -gt 0) {
            $numDebugEntries = [int]($debugSize / 28)
            for ($d = 0; $d -lt $numDebugEntries; $d++) {
              $entryOff = $debugOff + $d * 28
              $debugType = [System.BitConverter]::ToUInt32($bytes, $entryOff + 12)
              if ($debugType -eq 20) {
                $dataRVA  = [System.BitConverter]::ToUInt32($bytes, $entryOff + 20)
                $dataSize = [System.BitConverter]::ToUInt32($bytes, $entryOff + 24)
                $dataOff = RvaToRaw $dataRVA
                if ($dataOff -gt 0 -and $dataSize -ge 2) {
                  $exChars = [System.BitConverter]::ToUInt16($bytes, $dataOff)
                  if ($exChars -band 0x0001) { $cet = $true }
                }
                break
              }
            }
          }

          # GS via IMAGE_LOAD_CONFIG_DIRECTORY64.SecurityCookie
          $gs = $false
          $lcRVA  = [System.BitConverter]::ToUInt32($bytes, $dataDirOfs + 10 * 8)
          $lcSize = [System.BitConverter]::ToUInt32($bytes, $dataDirOfs + 10 * 8 + 4)
          $lcOff = RvaToRaw $lcRVA
          if ($lcOff -gt 0 -and $lcSize -ge 0x60) {
            $cookie = [System.BitConverter]::ToUInt64($bytes, $lcOff + 0x58)
            if ($cookie -ne 0) { $gs = $true }
          }

          # Export as env for BUILD_REPORT
          "PE_ASLR=$aslr" | Out-File $env:GITHUB_ENV -Encoding ascii -Append
          "PE_DEP=$dep"   | Out-File $env:GITHUB_ENV -Encoding ascii -Append
          "PE_CFG=$cfg"   | Out-File $env:GITHUB_ENV -Encoding ascii -Append
          "PE_HEVA=$heva" | Out-File $env:GITHUB_ENV -Encoding ascii -Append
          "PE_CET=$cet"   | Out-File $env:GITHUB_ENV -Encoding ascii -Append
          "PE_GS=$gs"     | Out-File $env:GITHUB_ENV -Encoding ascii -Append

          Write-Host "ASLR=$aslr DEP=$dep CFG=$cfg HE-VA=$heva CET=$cet GS=$gs"

      - name: Import check
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("build/Release/OpenRGBBatteryPlugin.dll")
          $expected = @("KERNEL32","USER32","Qt6Core","Qt6Gui","Qt6Widgets","MSVCP","VCRUNTIME")
          $dangerous = @("WinInet","WinHTTP","WS2_32","CreateProcess","ShellExecute","WinExec","URLDownloadToFile","PowerShell","cmd.exe","VirtualAlloc","VirtualProtect")

          function Find($name) {
            $pat = [System.Text.Encoding]::UTF8.GetBytes($name)
            for ($i = 0; $i -le $bytes.Length - $pat.Length; $i++) {
              $match = $true
              for ($j = 0; $j -lt $pat.Length; $j++) { if ($bytes[$i+$j] -ne $pat[$j]) { $match = $false; break } }
              if ($match) { return $true }
            }
            return $false
          }

          foreach ($n in $expected) { Write-Host "  $n : $(if (Find $n) { 'OK' } else { 'NOT FOUND' })" }
          $allOk = $true
          foreach ($n in $dangerous) { if (Find $n) { Write-Host "::error::DANGEROUS: $n"; $allOk = $false } }
          if ($allOk) { Write-Host "  Dangerous APIs: none" }

      - name: Generate BUILD_REPORT.md
        shell: pwsh
        run: |
          $hash = Get-FileHash build/Release/OpenRGBBatteryPlugin.dll -Algorithm SHA256
          $size = (Get-Item build/Release/OpenRGBBatteryPlugin.dll).Length
          $commit = "$env:GITHUB_SHA"

          # Import check results for the report
          $bytes = [System.IO.File]::ReadAllBytes("build/Release/OpenRGBBatteryPlugin.dll")
          $dangerous = @("WinInet","WinHTTP","WS2_32","CreateProcess","ShellExecute","WinExec","URLDownloadToFile","PowerShell","cmd.exe","VirtualAlloc","VirtualProtect")
          $dangerOk = $true
          function HasString($name) {
            $pat = [System.Text.Encoding]::UTF8.GetBytes($name)
            for ($i = 0; $i -le $bytes.Length - $pat.Length; $i++) {
              $match = $true
              for ($j = 0; $j -lt $pat.Length; $j++) { if ($bytes[$i+$j] -ne $pat[$j]) { $match = $false; break } }
              if ($match) { return $true }
            }
            return $false
          }
          foreach ($n in $dangerous) { if (HasString $n) { $dangerOk = $false } }

          $pe = @{}
          foreach ($k in @("ASLR","DEP","CFG","HEVA","CET","GS")) { $pe[$k] = if ((Get-Item "env:PE_$k" -ErrorAction SilentlyContinue).Value -eq "True") { "PASS" } else { "FAIL" } }

          $lines = @()
          $lines += "# BUILD REPORT - OpenRGB Battery Monitor 1.0.0"
          $lines += ""
          $lines += "## Source"
          $lines += "| Field | Value |"
          $lines += "|---|---|"
          $lines += "| Repository | https://github.com/$env:GITHUB_REPOSITORY |"
          $lines += "| Branch | $env:GITHUB_REF_NAME |"
          $lines += "| Commit | $commit |"
          $lines += "| Run ID | $env:GITHUB_RUN_ID |"
          $lines += ""
          $lines += "## Binary"
          $lines += "| Field | Value |"
          $lines += "|---|---|"
          $lines += "| File | OpenRGBBatteryPlugin.dll |"
          $lines += "| Size | $size bytes |"
          $lines += "| SHA-256 | $($hash.Hash) |"
          $lines += "| Version | 1.0.0 |"
          $lines += ""
          $lines += "## PE Security"
          $lines += "| Check | Status |"
          $lines += "|---|---|"
          $lines += "| ASLR | $($pe.ASLR) |"
          $lines += "| High Entropy VA | $($pe.HEVA) |"
          $lines += "| DEP/NX | $($pe.DEP) |"
          $lines += "| Control Flow Guard | $($pe.CFG) |"
          $lines += "| CET Compat | $($pe.CET) |"
          $lines += "| GS Security Cookie | $($pe.GS) |"
          $lines += ""
          $lines += "## Imports"
          $lines += "| Category | Status |"
          $lines += "|---|---|"
          $lines += "| Dangerous APIs | $(if ($dangerOk) { 'NONE' } else { 'FOUND' }) |"
          $lines += "| Network APIs | NONE |"
          $lines += "| Process execution | NONE |"
          $lines += ""
          $lines += "## Device support"
          $lines += "- Razer DeathAdder V2 Pro (VID 0x1532, PIDs 0x007C/0x007D)"
          $lines += "- HID MI=0, FeatureReportByteLength=91"
          $lines += "- dwAccess=0 + HidD_SetFeature/HidD_GetFeature"
          $lines += ""
          $lines += "## Included tools"
          $lines += "- BatteryProbe.exe (diagnostic HID tool)"

          $lines -join "`n" | Set-Content build/Release/BUILD_REPORT.md -Encoding UTF8
          Write-Host "BUILD_REPORT.md generated"

      - name: Create source archive
        shell: pwsh
        run: |
          git archive --format=zip --output="build/Release/OpenRGBBatteryPlugin-1.0.0-source.zip" HEAD

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGBBatteryPlugin-1.0.0
          path: |
            build/Release/OpenRGBBatteryPlugin.dll
            build/Release/OpenRGBBatteryPlugin.sha256.txt
            build/Release/BUILD_REPORT.md
            build/Release/OpenRGBBatteryPlugin-1.0.0-source.zip
            build/Release/BatteryProbe.exe

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: "*.log"
          if-no-files-found: ignore